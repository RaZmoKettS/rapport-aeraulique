<style>

*{box-sizing:border-box}

body{margin:0;font-family:Calibri,Arial,sans-serif;background:#e9edf1;color:#1c2833;height:100vh;display:flex;flex-direction:column}

header.top{background:#1f4e79;color:#fff;padding:10px 18px;display:flex;justify-content:space-between;align-items:center}
header.top h1{font-size:17px;margin:0}
header.top .brand{display:flex;align-items:center;gap:12px}
header.top .brand img{height:42px;width:auto;background:#fff;border-radius:8px;padding:3px 8px}

main{flex:1;display:flex;min-height:0}
#editor{width:600px;flex:none;overflow-y:auto;padding:14px;background:#fff;border-right:1px solid #cbd3da}
#preview{flex:1;overflow:auto;padding:20px 0}
#pages{width:794px;margin:0 auto}

fieldset{border:1px solid #cbd3da;border-radius:6px;margin:0 0 12px;padding:10px}
legend{font-weight:700;color:#1f4e79;padding:0 6px}
label{display:block;font-size:12px;margin:6px 0 2px;color:#52606d}
input[type=text],input[type=date],input[type=number],textarea{width:100%;padding:5px 7px;border:1px solid #b8c2cc;border-radius:4px;font:inherit;font-size:13px}
textarea{resize:vertical;min-height:60px}
button{cursor:pointer;border:0;border-radius:4px;padding:6px 11px;font:inherit;font-size:13px;background:#1f4e79;color:#fff}
button.sec{background:#e3e8ed;color:#1c2833}
button.del{background:#c0392b;padding:3px 8px}
button.exp{background:#2e8b57;font-weight:700}

.card{background:#f5f7f9;border:1px solid #d5dce2;border-radius:5px;padding:8px;margin:8px 0}
.row{display:flex;gap:6px;align-items:center;justify-content:space-between}
.grid5{display:grid;grid-template-columns:repeat(5,1fr) auto;gap:4px;margin:4px 0}
.grid3{display:grid;grid-template-columns:3fr 1fr 2fr auto;gap:4px;margin:4px 0}
.per{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.per div{display:flex;gap:5px;align-items:center;font-size:12px}
.per input[type=text]{width:70px;padding:3px 5px}
.per label,.chk label{display:inline;margin:0;color:#1c2833}
.chk{display:flex;gap:6px;align-items:center;margin:4px 0;font-size:13px}
.hint{font-size:11px;color:#6b7785;margin:6px 0}
.wn{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:10px;align-items:start}
.note{font-size:11px;line-height:1.35;color:#6b5400;background:#fff8e1;border-left:3px solid #e0b100;border-radius:3px;padding:6px 8px;white-space:pre-line}
.grid2{display:grid;grid-template-columns:1fr 1fr auto;gap:4px;margin:4px 0}
.note b{display:block;margin-bottom:2px}


.sheet{position:relative;width:794px;height:1123px;background:#fff;margin:0 0 18px;box-shadow:0 2px 10px rgba(0,0,0,.25);overflow:hidden;font-family:Calibri,Arial,sans-serif;font-size:11pt;color:#000}
.sheet .body{position:absolute;left:94px;top:128px;width:606px;height:860px;overflow:hidden}
.sheet .logo{position:absolute;left:19px;top:8px;width:119px}
.sheet .tag{position:absolute;left:148px;top:72px;width:327px}
.sheet .pgn{position:absolute;right:94px;top:64px;font-size:10pt;color:#555}
.sheet .hdate{position:absolute;right:94px;top:40px;font-size:11pt}
.sheet .band{position:absolute;left:0;right:0;bottom:0;height:40px;background:#159D4E}
.sheet .tri{position:absolute;left:0;bottom:0;width:166px;height:92px;background:#159DD9;clip-path:polygon(0 0,54px 0,100% 100%,0 100%)}
.sheet .fc{position:absolute;bottom:54px;font:7.5pt "Gill Sans MT",Arial,sans-serif;color:#555;line-height:1.25;padding-left:7px;border-left:3px solid}

.mb{display:flow-root}
#measure{position:absolute;left:-9999px;top:0;width:606px;visibility:hidden;font-family:Calibri,Arial,sans-serif;font-size:11pt}
.sheet h1,#measure h1{font-size:22pt;color:#4A7EBB;text-align:center;margin:60px 0 40px}
.sheet h2,#measure h2{font-size:13pt;color:#4A7EBB;margin:14pt 0 8pt;font-weight:bold}
.sheet h2 u,#measure h2 u{margin-left:6px}
.sheet h3,#measure h3{font-size:11.5pt;color:#4A7EBB;margin:8pt 0 4pt}
.sheet p,#measure p{margin:2pt 0}
.sheet ul,#measure ul{margin:0 0 0 18pt;padding:0}
.sheet table.mt,#measure table.mt{border-collapse:collapse;width:100%;table-layout:fixed}
.sheet td,.sheet th,#measure td,#measure th{border:1px solid #000;padding:4px 6px;font-size:10pt;vertical-align:middle}
.sheet th,#measure th{background:#595959;color:#fff;text-align:center;font-weight:bold}

.toc{display:flex;align-items:baseline;font-size:9.5pt;margin:7pt 0}
.toc .n{width:34px;flex:none}.toc.l2{padding-left:14px}.toc.l2 .n{width:40px}
.toc .d{flex:1;border-bottom:1px dotted #000;margin:0 4px}
.toc.l1 .t,.toc.l1 .n{font-weight:bold}

#xo{position:fixed;inset:0;background:rgba(15,35,55,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9999}
#xo.show{opacity:1;pointer-events:auto}
.xbox{background:#fff;border-radius:16px;padding:26px 40px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);min-width:330px;transform:translateY(12px) scale(.96);transition:transform .3s}
#xo.show .xbox{transform:none}
.xlogo{position:relative;width:220px;height:118px;margin:0 auto 10px;overflow:hidden}
.vsvg{width:100%;height:100%;display:block;overflow:hidden}
.road{stroke:#aab4be;stroke-width:3;stroke-dasharray:16 14;stroke-linecap:round}
.van{transform-origin:108px 104px}
.wh{transform-box:fill-box;transform-origin:center}
.puff{opacity:0;transform-box:fill-box;transform-origin:center}
#xo.show .road{animation:xroad .3s linear infinite}
#xo.show .van{animation:xstart .8s ease-out,xbob .32s .8s ease-in-out infinite}
#xo.show .wh{animation:xspin .4s linear infinite}
#xo.show .puff{animation:xpuff .9s ease-out infinite}
#xo.show .p2{animation-delay:.3s}#xo.show .p3{animation-delay:.6s}
#xo.done .van{animation:xgo .8s cubic-bezier(.5,0,.9,.55) forwards}
#xo.done .wh{animation-duration:.16s}
.xck{position:absolute;left:50%;top:50%;margin:-32px 0 0 -32px;width:64px;height:64px;opacity:0;transform:scale(.4)}
#xo.done .xck{opacity:1;transform:scale(1);transition:all .35s .6s cubic-bezier(.2,1.6,.4,1)}
.xc{fill:#159D4E}.xp{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40}
#xo.done .xp{animation:xdr .45s .9s ease forwards}
.xt1{font-size:16px;font-weight:700;color:#1f4e79}.xt2{font-size:12px;color:#6b7785;margin-top:3px;min-height:16px}

.xbar{height:4px;background:#e3e8ed;border-radius:3px;overflow:hidden;margin-top:14px}
.xbar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#159DD9,#159D4E);border-radius:3px;animation:xbr 1s ease-in-out infinite}

function unitsToHtml(us){

    if(u.tid){var j=i,rows="";while(j<us.length&&us[j].tid===u.tid){rows+=us[j].html;j++;}o+=tableHtml(u.tid,rows);i=j;}

function hOf(html){var m=document.getElementById("measure");m.innerHTML='<div class="mb">'+html.replace(/src="data:image[^"]*"/g,'src=""')+'</div>';return m.firstChild.offsetHeight;}
function paginate(U){
  // heads : hauteur de l'en-tête de chaque tableau (à répéter en haut quand un tableau continue sur la page suivante)
  var heads={};
  Object.keys(TB).forEach(function(t){heads[t]=hOf(tableHtml(t,""));});
  // hs : hauteur de chaque unité (les lignes de tableau sont mesurées SANS leur en-tête)
  var hs=U.map(function(u){return u.tid?hOf(tableHtml(u.tid,u.html))-heads[u.tid]:hOf(u.html);});
  // pages = liste de pages (chacune = liste d'unités) ; used = hauteur déjà occupée sur la page courante
  var pages=[[]],used=0,cur=null;
  // on traite les unités UNE PAR UNE, dans l'ordre
  for(var i=0;i<U.length;i++){
    var u=U[i],st=u.tid&&cur!==u.tid,own=hs[i]+(st?heads[u.tid]:0),need=own,nonEmpty=pages[pages.length-1].length>0;
    // keep : on réserve aussi la place du bloc suivant (un titre ne reste pas seul en bas de page)
    if(u.keep&&U[i+1])need+=(U[i+1].tid?heads[U[i+1].tid]:0)+hs[i+1];
    // SAUT DE PAGE si : demandé (brk) OU si ça ne tient plus (used+need>CAP) -> nouvelle page, used remis à 0
    if(nonEmpty&&(u.brk||used+need>CAP)){pages.push([]);used=0;cur=null;st=!!u.tid;own=hs[i]+(st?heads[u.tid]:0);}
    // on place l'unité sur la page courante et on augmente la hauteur utilisée
    pages[pages.length-1].push(u);used+=own;cur=u.tid||null;
  }
  return pages;
}

function wr(t,o){

  var rp='<w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/>'+(o.b?'<w:b/>':'')+(o.i?'<w:i/>':'')+(o.c?'<w:color w:val="'+o.c+'"/>':'')+'<w:sz w:val="'+sz+'"/><w:szCs w:val="'+sz+'"/>'+(o.u?'<w:u w:val="single"/>':'');
  return '<w:r><w:rPr>'+rp+'</w:rPr>'+String(t).split(/(\r?\n|\t)/).map(function(x){
    if(x==="\t")return '<w:tab/>';if(/^\r?\n$/.test(x))return '<w:br/>';if(x==="")return '';
    return '<w:t xml:space="preserve">'+X(x)+'</w:t>';}).join("")+'</w:r>';

   +'<w:spacing w:before="'+(o.bf||0)+'" w:after="'+(o.af==null?60:o.af)+'"/>'

async function makeDocx(JSZipLib,tplB64,bodyXml,dateStr,imgs,total){
  // ouvre le modèle Word (un zip) en mémoire
  var zip=await JSZipLib.loadAsync(tplB64,{base64:true});
  var doc=await zip.file("word/document.xml").async("string");
  // on REMPLACE tout le corps du modèle par le contenu généré (bodyXml)
  doc=doc.replace(/<w:body>[\s\S]*?(<w:sectPr)/,function(m,s){return '<w:body>'+bodyXml+s;});
  doc=doc.replace(/w:top="1417"/,'w:top="1920"').replace(/w:bottom="1417"/,'w:bottom="2020"');
  /* page de garde sans en-tête numéroté : en-tête "première page" + pagination sur les autres */
  doc=doc.replace(/(<w:headerReference w:type="default" r:id="[^"]+"\/>)/,'$1<w:headerReference w:type="first" r:id="rIdAAIH2"/>');
  doc=doc.replace(/(<w:footerReference w:type="default" r:id="([^"]+)"\/>)/,'$1<w:footerReference w:type="first" r:id="$2"/>');
  doc=doc.replace("<w:docGrid","<w:titlePg/><w:docGrid");
  zip.file("word/document.xml",doc);
  var rels=await zip.file("word/_rels/document.xml.rels").async("string");
  var ct=await zip.file("[Content_Types].xml").async("string");
  var add='<Relationship Id="rIdAAIH2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/header" Target="header2.xml"/>';
  ct=ct.replace("</Types>",'<Override PartName="/word/header2.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.header+xml"/></Types>');
  // chaque photo est ajoutée dans le dossier word/media du zip + déclarée dans les fichiers de liens
  (imgs||[]).forEach(function(d,k){
    var m=/^data:image\/(\w+);base64,(.*)$/.exec(d),ext=m[1];
    zip.file("word/media/aai_img"+k+"."+ext,m[2],{base64:true});
    add+='<Relationship Id="rIdAAIImg'+k+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/aai_img'+k+'.'+ext+'"/>';
    if(ct.indexOf('Extension="'+ext+'"')<0)ct=ct.replace("<Default ",'<Default Extension="'+ext+'" ContentType="image/'+ext+'"/><Default ');
  });
  zip.file("word/_rels/document.xml.rels",rels.replace("</Relationships>",add+"</Relationships>"));
  zip.file("[Content_Types].xml",ct);
  var p=dateStr.split("/"),hd=await zip.file("word/header1.xml").async("string"),n=0;

  if(!db){cb();return;}
  try{var tx=db.transaction("kv","readwrite");tx.objectStore("kv").delete(key);tx.oncomplete=tx.onerror=tx.onabort=function(){db.close();cb();};}catch(e){db.close();cb();}});}
function doSave(){if(NOSAVE)return;var j;try{j=JSON.stringify({v:SAVE_V,t:Date.now(),state:state});}catch(e){SV("⚠ Non sauvegardé",1);return;}
  SV("Sauvegarde…");kvSet(SAVE_KEY,j,function(ok){SV(ok?"✓ Enregistré":"⚠ Non sauvegardé (mémoire pleine ?)",!ok);});}
function scheduleSave(){if(NOSAVE)return;SV("Modifié…");clearTimeout(saveT);saveT=setTimeout(function(){saveT=null;doSave();},700);}
function flushSave(){if(saveT){clearTimeout(saveT);saveT=null;doSave();}}
/* chaque mise à jour de l'aperçu (donc chaque modification) déclenche une sauvegarde différée */
var _renderPreview=renderPreview;renderPreview=function(){_renderPreview();if(READY)scheduleSave();};
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")flushSave();});
window.addEventListener("pagehide",flushSave);
function okState(s){try{if(!s||typeof s!=="object"||!s.info||!s.secs||!s.on||!s.types||!(s.order instanceof Array))return false;
  for(var i=0;i<s.order.length;i++){var S=s.secs[s.order[i]];if(!S||!(S.blocks instanceof Array))return false;}return true;}catch(e){return false;}}
function applySaved(s){var k,i;for(k in s){if(!Object.prototype.hasOwnProperty.call(s,k))continue;
  if(k==="info"){for(i in s.info)state.info[i]=s.info[i];}else state[k]=s[k];}}
function newReport(){
  if(!confirm("Commencer un NOUVEAU rapport ?\n\nLe rapport en cours sera effacé de cet appareil.\nPensez à l'exporter en Word avant."))return;
  NOSAVE=true;clearTimeout(saveT);saveT=null;kvDel(SAVE_KEY,function(){location.reload();});}
function setTab(t){document.body.setAttribute("data-tab",t==="prev"?"prev":"form");fit();try{window.scrollTo(0,0);}catch(e){}}
async function saveBlob(blob,fn,fromTap){
  if(fromTap&&navigator.canShare&&navigator.share){
    try{var f=new File([blob],fn,{type:blob.type||"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
      if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:fn});return;}}
    catch(e){if(e&&e.name==="AbortError")return;}}
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},60000);}
function splash(){var s=document.getElementById("splash");if(!s)return;
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches){s.remove();return;}
  document.getElementById("splogo").src=IMG_LOGO;var h="";
  for(var i=0;i<12;i++)h+='<i style="top:'+(10+i*7.4)+'%;width:'+(90+(i*53)%170)+'px;--d:'+(0.9+(i%4)*0.18)+'s;--t:'+(0.55+(i%6)*0.17)+'s"></i>';
  s.insertAdjacentHTML("beforeend",h);requestAnimationFrame(function(){s.classList.add("go");});
  var end=function(){s.classList.add("out");setTimeout(function(){if(s.parentNode)s.remove();},600);};
  setTimeout(end,2600);s.addEventListener("click",end);}
function startApp(){
  splash();
  document.getElementById("hlogo").src=IMG_LOGO;
  var done=false;
  function go(raw,timedOut){
    if(done)return;done=true;var restored=false,when=0;
    if(raw){try{var o=JSON.parse(raw);if(o&&o.v===SAVE_V&&okState(o.state)){applySaved(o.state);restored=true;when=o.t;}}catch(e){}}
    renderEditor();renderPreview();READY=true;
    if(timedOut){NOSAVE=true;SV("⚠ Sauvegarde indisponible",1);}
    else if(restored){var d=new Date(when);SV("✓ Restauré");toast("Rapport restauré (dernière modification à "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)+")");}
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  }
  kvGet(SAVE_KEY,function(raw){go(raw,false);});
  setTimeout(function(){go(null,true);},4000);
  if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
}
/* ---- Démarrage ---- */
startApp();

</script>
